<title>T-Shirts</title>
<style>
:root{
  --paper:#ECEDEA; --card:#F6F6F4; --ink:#16181D; --mute:#7C8089;
  --rule:#D6D7D2; --rule-soft:#E3E4E0; --thread:#A63D3D;
  --sel:#16181D; --sel-ink:#ECEDEA;
  --label:'Avenir Next Condensed','Avenir Next','Helvetica Neue',ui-sans-serif,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,ui-sans-serif,sans-serif;
  --data:ui-monospace,'SF Mono',Menlo,'Roboto Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#16181D;--card:#1D2026;--ink:#E7E8E4;--mute:#8B8F98;
    --rule:#2C3038;--rule-soft:#23262D;--thread:#D97C7C;--sel:#E7E8E4;--sel-ink:#16181D}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;
  -webkit-text-size-adjust:100%;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:var(--paper);
  padding:calc(10px + env(safe-area-inset-top)) 16px 0;border-bottom:1px solid var(--rule)}
.masthead{display:flex;align-items:baseline;gap:10px}
.masthead h1{font-family:var(--label);text-transform:uppercase;letter-spacing:.15em;font-size:14px;
  font-weight:600;margin:0}
.masthead .count{margin-left:auto;font-family:var(--data);font-size:12px;color:var(--mute)}
.navrow{display:flex;align-items:center;gap:8px;padding:11px 0 10px}
.nav{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;
  color:var(--mute);border:1px solid var(--rule);border-radius:2px;padding:5px 9px;background:var(--card)}
.nav.here{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.navrow .sp{margin-left:auto;display:flex;gap:16px;align-items:center}
.navrow .sp button{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:12px;
  font-weight:600;color:var(--mute)}
.navrow .sp button.add{color:var(--ink)}
.back{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600}

main{padding:0 16px}
section{padding:18px 0 4px}
.eyebrow{font-family:var(--label);text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;
  color:var(--mute);font-weight:600;margin:0 0 9px}

/* ---------- group-by pad ---------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.pk{position:relative;border:1px solid var(--rule);border-radius:2px;background:var(--card);
  padding:11px 8px 10px;font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;
  font-size:11.5px;font-weight:600;color:var(--mute);text-align:left}
.pk[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.pk .t{position:absolute;top:5px;right:7px;font-family:var(--data);font-size:10px;opacity:.85}
.pk .sub{display:block;font-family:var(--data);text-transform:none;letter-spacing:0;font-size:9.5px;
  opacity:.55;margin-top:2px}
.padhint{font-size:12px;color:var(--mute);margin:9px 0 0;min-height:1.35em}
.padhint b{font-weight:600;color:var(--ink)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:6px;margin-top:14px}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{padding:6px 11px;font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;
  font-size:11px;font-weight:600;color:var(--mute);background:var(--card)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.toolbar .right{margin-left:auto;display:flex;gap:6px}
.chip{border:1px solid var(--rule);border-radius:2px;padding:5px 9px;font-family:var(--label);
  text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--mute);
  display:inline-flex;align-items:center;gap:6px;background:var(--card)}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.chip .sw{width:9px;height:9px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45);flex:none}
.chip .n{font-family:var(--data);letter-spacing:0;opacity:.65}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chipgroup{margin-top:12px}
.filterpanel{border:1px solid var(--rule-soft);border-radius:2px;padding:4px 12px 14px;margin-top:10px;
  background:var(--card)}
.filterpanel input[type=search]{width:100%;background:var(--paper);border:1px solid var(--rule-soft);
  border-radius:2px;padding:9px 10px;font-size:15px;margin-top:12px}
.filtertoggle{display:flex;align-items:center;gap:8px;margin-top:14px}
.filtertoggle .clear{margin-left:auto;font-family:var(--label);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--thread);font-weight:600}

/* ---------- grouped list ---------- */
.g1,.g2,.g3{display:flex;align-items:baseline;gap:8px}
.g1{border-bottom:1.5px solid var(--ink);padding-bottom:6px;margin:30px 0 0}
.g1 h2{font-family:var(--label);text-transform:uppercase;letter-spacing:.15em;font-size:17px;margin:0;
  font-weight:600}
.g2{margin:20px 0 2px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.g2 h3{font-family:var(--label);text-transform:uppercase;letter-spacing:.13em;font-size:14px;margin:0;
  font-weight:600;color:var(--ink)}
.g3{margin:15px 0 1px;padding-bottom:4px;border-bottom:1px dotted var(--rule-soft)}
.g3 h4{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:12px;margin:0;
  font-weight:600;color:var(--ink)}
.g1 .n{margin-left:auto;font-family:var(--data);font-size:16px}
.g2 .n{margin-left:auto;font-family:var(--data);font-size:14px}
.g3 .n{margin-left:auto;font-family:var(--data);font-size:12px;color:var(--mute)}
.ghead .sw{width:12px;height:12px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45);flex:none;
  align-self:center}
.gmix{font-family:var(--data);font-size:10px;color:var(--mute);letter-spacing:0;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;
  padding-left:10px}
.g1 .gmix,.g2 .gmix,.g3 .gmix{margin-left:0}
.gmix+.n{margin-left:10px}
.d2{padding-left:11px}
.d3{padding-left:22px}

.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule-soft);
  width:100%;text-align:left}
.sw-lg{width:30px;height:30px;flex:none;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45);margin-top:2px;
  display:block}
.veesvg{box-shadow:none!important;background:none!important;display:block;overflow:visible}
.item .body{flex:1;min-width:0;display:block}
.item .l1{display:block;font-size:15px;letter-spacing:-.01em}
.item .l1 .lead{font-weight:600}
.item .l2{display:block;font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;
  font-size:10.5px;color:var(--mute);margin-top:4px;font-weight:600}
.item .qty{font-family:var(--data);font-size:17px;flex:none;padding-top:2px;min-width:22px;text-align:right}
.flag{color:var(--thread)}
.retired .body,.retired .qty,.retired .sw-lg{opacity:.42}

/* ---------- tile view ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:9px;margin-top:12px}
.tile{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--rule);
  border-radius:2px;background:var(--card);padding:10px 11px}
.tile .face{position:relative;width:40px;height:40px;flex:none;align-self:flex-start}
.tile .fill{position:absolute;inset:0;width:100%;height:100%;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.45)}
.tile .q{position:absolute;right:2px;bottom:1px;font-family:var(--data);font-size:13px;line-height:1}
.tile .cap{flex:1;min-width:0;font-family:var(--label);text-transform:uppercase;letter-spacing:.07em;
  font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .cap span{display:block;color:var(--mute);font-size:10px;letter-spacing:.05em;margin-top:3px;
  white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.retired{opacity:.42}
.tile .face.zeroed{opacity:.35}
.arow .sw-lg,.arow .veesvg{align-self:center;margin-top:0}

/* ---------- wardrobe grid + tables ---------- */
.wgrid{display:flex;flex-wrap:wrap;gap:3px}
.wgrid .u{width:16px;height:16px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4);display:block}
.wrow{margin-bottom:15px}
.wrow .cap{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.wrow .cap span:first-child{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;
  font-size:11px;font-weight:600}
.wrow .cap .n{margin-left:auto;font-family:var(--data);font-size:11px;color:var(--mute)}
.legend{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--mute);
  display:flex;gap:14px;align-items:center;margin-top:4px;font-weight:600}
.legend i,.legend .v{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:5px}
.legend i{box-shadow:inset 0 0 0 1px var(--mute)}
.legend .v{overflow:visible}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--rule-soft)}
th{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:var(--mute);
  font-weight:600;border-bottom:1px solid var(--rule)}
td.k,th.k{text-align:left}
td.k{font-size:14px}
td.k.sub{padding-left:16px;font-size:13px;color:var(--mute)}
td.n{font-family:var(--data);font-size:14px}
td.n.zero span{display:none}
td.n.zero{color:var(--rule)}
td.n.zero::after{content:"·"}
tr.tot td{border-bottom:0;border-top:1px solid var(--ink);font-weight:600}
.kcell{display:flex;align-items:center;gap:8px}
.kcell .sw{width:12px;height:12px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45);flex:none}
.note{font-size:12.5px;color:var(--mute);margin-top:10px;line-height:1.45}

/* ---------- stock-take ---------- */
.prog{margin-top:16px;border:1px solid var(--rule);border-radius:2px;background:var(--card);padding:13px 13px 12px}
.prog .bar{height:6px;background:var(--rule-soft);position:relative;overflow:hidden}
.prog .bar i,.prog .bar u{position:absolute;top:0;bottom:0;transition:width .25s ease,left .25s ease}
.prog .bar i{left:0;background:var(--ink)}
.prog .bar u{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 5px)}
.prog .figs{display:flex;align-items:baseline;gap:8px;margin-top:10px;font-family:var(--label);
  text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:600;color:var(--mute)}
.prog .figs b{font-family:var(--data);font-size:19px;letter-spacing:0;color:var(--ink);font-weight:400}
.prog .figs{flex-wrap:wrap;gap:14px}
.prog .figs .out{margin-left:auto;color:var(--thread)}
.prog .figs .out b{color:var(--thread)}
.arow{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.arow .body{flex:1;min-width:0}
.arow .l1{display:block;font-size:14.5px;letter-spacing:-.01em;font-weight:600}
.arow .l2{display:block;font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;
  font-size:10px;color:var(--mute);margin-top:3px;font-weight:600}
.arow.done .body{opacity:.4}
.arow.done .sw-lg{opacity:.5}
.pipkey{display:flex;align-items:center;gap:13px;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--rule-soft);font-family:var(--label);text-transform:uppercase;
  letter-spacing:.1em;font-size:9.5px;font-weight:600;color:var(--mute)}
.pipkey span{display:flex;align-items:center;gap:5px}
.pipkey .pip{width:auto;height:auto;pointer-events:none}
.pipkey .tapnote{margin-left:auto;font-style:normal;opacity:.75}
.allhere{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-size:10px;
  font-weight:600;color:var(--mute);border:1px solid var(--rule);border-radius:2px;padding:3px 7px;
  margin-left:10px;align-self:center}
.arow.carried .l2{color:var(--thread)}
.pips{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:132px}
.pip{width:26px;height:30px;display:flex;align-items:center;justify-content:center}
.pip::before{content:"";width:17px;height:17px;box-shadow:inset 0 0 0 1.5px var(--rule);
  background:transparent}
.pip.s-w::before{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pip.s-l::before{box-shadow:inset 0 0 0 1.5px var(--ink);
  background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 5px)}
.pip.wide{width:auto;padding:0 8px;font-family:var(--data);font-size:13px;
  box-shadow:inset 0 0 0 1px var(--rule)}
.pip.wide::before{display:none}
.hist{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:12px 0;
  border-bottom:1px solid var(--rule-soft)}
.hist .d{font-size:14.5px}
.hist .r{margin-left:auto;font-family:var(--data);font-size:13px;color:var(--mute)}
.bigbtn{width:100%;border:1px solid var(--ink);border-radius:2px;padding:14px;margin-top:16px;
  font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;
  background:var(--sel);color:var(--sel-ink)}
.ghostbtn{width:100%;border:1px solid var(--rule);border-radius:2px;padding:13px;margin-top:9px;
  font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;font-weight:600;
  color:var(--mute)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,11,14,.42);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .18s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--paper);border-top:1px solid var(--rule);
  border-radius:10px 10px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .22s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.sheethead{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;padding:14px 0 12px;
  border-bottom:1px solid var(--rule);margin-bottom:4px}
.sheethead h3{font-family:var(--label);text-transform:uppercase;letter-spacing:.16em;font-size:12px;margin:0;
  font-weight:600}
.sheethead button{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:600}
.sheethead .done{margin-left:auto;color:var(--ink)}
.sheethead .cancel{color:var(--mute);margin-right:14px}
.f{padding:12px 0 0}
.f label{display:block;font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;
  color:var(--mute);font-weight:600;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--card);border:1px solid var(--rule-soft);
  border-radius:2px;padding:10px;font-size:16px}
.f2{display:flex;gap:10px}
.f2>*{flex:1;min-width:0}
.stepper{display:flex;align-items:center;border:1px solid var(--rule-soft);border-radius:2px;
  background:var(--card);width:100%}
.stepper button{flex:none;width:46px;height:44px;font-size:20px;font-family:var(--data)}
.stepper .v{flex:1;text-align:center;font-family:var(--data);font-size:17px}
.rowbtns{display:flex;gap:10px;margin-top:20px}
.rowbtns button{flex:1;border:1px solid var(--rule);border-radius:2px;padding:12px;font-family:var(--label);
  text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;font-weight:600}
.rowbtns .danger{color:var(--thread);border-color:var(--thread)}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.menu button{display:block;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--rule-soft);
  font-size:15px}
.menu button small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
textarea.io{font-family:var(--data);font-size:12px;height:180px;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.empty{padding:44px 0;text-align:center;color:var(--mute);font-size:14px}
.empty b{display:block;font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:12px;
  color:var(--ink);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--sel);color:var(--sel-ink);padding:9px 16px;border-radius:2px;z-index:90;font-family:var(--label);
  text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:600;opacity:0;transition:opacity .2s;
  pointer-events:none;max-width:80vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="masthead">
    <h1 id="hdrTitle">T-Shirt Wardrobe</h1>
    <span class="count num" id="hdrCount"></span>
  </div>
  <div class="navrow" id="navrow"></div>
</header>

<main><div id="view"></div></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================== storage ============================== */
const KEY = "tshirts.v1";
const Store = {
  mode:"memory", mem:null,
  async init(){
    if (typeof window !== "undefined" && window.storage && window.storage.get){ this.mode = "host"; return; }
    try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); this.mode = "local"; }
    catch(e){ this.mode = "memory"; }
  },
  async load(){
    try{
      if (this.mode === "host"){ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
      if (this.mode === "local"){ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }
      return this.mem;
    }catch(e){ return this.mode === "memory" ? this.mem : null; }
  },
  async save(data){
    try{
      if (this.mode === "host"){ await window.storage.set(KEY, JSON.stringify(data)); return true; }
      if (this.mode === "local"){ localStorage.setItem(KEY, JSON.stringify(data)); return true; }
      this.mem = data; return true;
    }catch(e){ this.mem = data; return false; }
  }
};

/* ============================== colour ============================== */
const SWATCH = {
  "black":"#1C1C1E","navy":"#26334D","grey":"#9A9A9E","mid-grey":"#818288","dark grey":"#55555A",
  "light grey":"#C6C7CB","charcoal":"#3A3B40","white":"#F7F7F3","off-white":"#EAE7DE","ecru":"#DED8C8",
  "red":"#A63D3D","blue":"#4A6FA5","olive":"#5F6647","green":"#41654E","brown":"#6B5647","stone":"#B7B0A4",
  "cream":"#E8E2D2","sand":"#CFC3AC","burgundy":"#5E2A34","pink":"#C99AA0","mustard":"#B08A3E",
  "mixed":"repeating-linear-gradient(45deg,#8A8D94 0 4px,#C6C7CB 4px 8px)"
};
const HATCH = "repeating-linear-gradient(45deg,#8A8D94 0 4px,#C6C7CB 4px 8px)";
function swatchCSS(c){ return SWATCH[String(c||"").trim().toLowerCase()] || HATCH; }
function swatchStyle(c){
  const v = swatchCSS(c);
  return v.indexOf("repeating") === 0 ? "background-image:" + v : "background-color:" + v;
}
function inkOn(c){                       // readable text colour over a swatch
  const v = swatchCSS(c);
  if (v.indexOf("#") !== 0) return "#16181D";
  const r = parseInt(v.substr(1,2),16), g = parseInt(v.substr(3,2),16), b = parseInt(v.substr(5,2),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#16181D" : "#F2F2EE";
}
function rgb(c){
  const v = swatchCSS(c);
  if (v.indexOf("#") !== 0) return null;
  return [parseInt(v.substr(1,2),16), parseInt(v.substr(3,2),16), parseInt(v.substr(5,2),16)];
}
function colourRank(c){                    // greyscale darkest-first, then everything else
  const p = rgb(c);
  if (!p) return 1999;
  const l = 0.299*p[0] + 0.587*p[1] + 0.114*p[2];
  const grey = Math.max(p[0],p[1],p[2]) - Math.min(p[0],p[1],p[2]) <= 14;
  return (grey ? 0 : 1000) + l;
}
function rankKey(c){ return String(Math.round(colourRank(c))).padStart(5,"0"); }
function swatchHTML(colour, vee, cls){
  if (!vee) return '<i class="' + cls + '" style="' + swatchStyle(colour) + '"></i>';
  const v = swatchCSS(colour);
  const fill = v.indexOf("#") === 0 ? v : "#9A9A9E";
  return '<svg class="' + cls + ' veesvg" viewBox="0 0 40 40" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="M1.2 1.2 H12.5 L20 16 L27.5 1.2 H38.8 V38.8 H1.2 Z" fill="' + fill +
    '" stroke="rgba(128,128,128,.55)" stroke-width="2.4"/></svg>';
}
function family(c){                      // each shade stands on its own
  const k = String(c||"").trim();
  if (!k) return "Unspecified";
  return k.toLowerCase().replace(/(^|[\s-])(\w)/g, (m,a,b) => a + b.toUpperCase());
}

/* ============================== fabric ============================== */
const FABRIC_FAMILIES = ["Pure Cotton","Cotton Blend","Other"];
const FABRIC_MAP = { "supima":"Pure Cotton","pima":"Pure Cotton","cotton":"Pure Cotton",
  "organic cotton":"Pure Cotton","60/40":"Cotton Blend","66/34":"Cotton Blend","66/33":"Cotton Blend" };
function fabricLabel(i, familyGrouped){
  if (!i.fabric) return i.ffam;
  if (familyGrouped) return i.fabric;              // the group header already says the family
  return i.ffam + " (" + i.fabric + ")";
}
function fabricFamily(f){
  const k = String(f||"").trim().toLowerCase();
  if (!k) return "Other";
  if (FABRIC_MAP[k]) return FABRIC_MAP[k];
  if (/^\d{1,3}\/\d{1,3}$/.test(k)) return "Cotton Blend";     // any ratio reads as a blend
  if (k.indexOf("blend") > -1) return "Cotton Blend";
  if (k.indexOf("cotton") > -1) return "Pure Cotton";
  return "Other";
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function thisMonth(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function cohort(a){ if (!a) return "Legacy"; const p = a.split("-"); return MONTHS[+p[1]-1] + " " + p[0].slice(2); }
const DIMS = {
  cut:    {label:"Cut",    key:i => i.neck || "—",        order:["Crew","Vee","Other"], suffix:{Crew:" neck", Vee:" neck"}},
  colour: {label:"Colour", key:i => family(i.colour),     swatch:true, sort:i => rankKey(i.colour)},
  brand:  {label:"Brand",  key:i => i.brand || "—"},
  fabric: {label:"Fabric", key:i => i.ffam,               order:FABRIC_FAMILIES, mix:true},
  cohort: {label:"Cohort", key:i => cohort(i.acquired),   sort:i => i.acquired || "0000-00", desc:true},
  size:   {label:"Size",   key:i => i.size || "—",        order:["XS","S","M","L","XL","XXL","—"]}
};
const DIM_KEYS = ["cut","colour","brand","fabric","cohort","size"];

/* ============================== helpers ============================== */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function el(id){ return document.getElementById(id); }
function sum(l){ return l.reduce((t,i) => t + i.qty, 0); }
function uniq(list, fn){ const s = []; list.forEach(i => { const v = fn(i); if (v && s.indexOf(v) < 0) s.push(v); }); return s; }

function wardrobe(){ return items.filter(i => i.cat === "Everyday" && (ui.showRetired || !i.retired)); }
function pyjamas(){ return items.filter(i => i.cat === "Pyjamas"); }
function filtered(){
  return wardrobe().filter(i => {
    for (const k of DIM_KEYS){
      const f = ui.filters[k];
      if (f.length && f.indexOf(DIMS[k].key(i)) < 0) return false;
    }
    if (ui.q){
      const hay = [i.brand,i.fabric,i.ffam,i.colour,i.size,i.fit,i.notes,cohort(i.acquired)].join(" ").toLowerCase();
      if (hay.indexOf(ui.q.toLowerCase()) < 0) return false;
    }
    return true;
  });
}
function filterCount(){ return DIM_KEYS.reduce((t,k) => t + ui.filters[k].length, 0) + (ui.q ? 1 : 0); }

function groupOrder(list, dk){
  const d = DIMS[dk];
  const keys = uniq(list, d.key);
  if (d.order) keys.sort((a,b) => {
    const ia = d.order.indexOf(a), ib = d.order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  else if (d.sort) keys.sort((a,b) => {
    const va = d.sort(list.find(i => d.key(i) === a)), vb = d.sort(list.find(i => d.key(i) === b));
    return d.desc ? vb.localeCompare(va) : va.localeCompare(vb);
  });
  else keys.sort((a,b) => sum(list.filter(i => d.key(i) === b)) - sum(list.filter(i => d.key(i) === a)) || a.localeCompare(b));
  return keys;
}

/* ============================== item rendering ============================== */
function leadAndMeta(i){
  const g = k => ui.screen !== "pyjamas" && ui.tiers.indexOf(k) > -1;
  const lead = [];
  if (!g("colour")) lead.push(i.colour || "Unspecified");
  if (!g("brand") && i.brand) lead.push(i.brand);
  const meta = [];
  if (i.fabric || i.ffam) meta.push(fabricLabel(i, g("fabric")));
  if (i.fit) meta.push(i.fit);
  if (!g("size") && i.size) meta.push("Size " + i.size);
  if (!g("cohort")) meta.push(cohort(i.acquired));
  if (i.notes) meta.push(i.notes);
  if (i.retired) meta.push("Retired");
  if (!lead.length) lead.push(meta.shift() || "Shirt");
  return { lead: lead.join(" — "), meta: meta.join(" · ") };
}
function itemRow(i){
  const lm = leadAndMeta(i);
  return '<button class="item' + (i.retired ? " retired" : "") + '" data-id="' + i.id + '">' +
    swatchHTML(i.colour, i.neck === "Vee", "sw-lg") +
    '<span class="body"><span class="l1"><span class="lead">' + esc(lm.lead) + '</span>' +
'</span>' +
    '<span class="l2">' + esc(lm.meta) + '</span></span>' +
    '<span class="qty">' + i.qty + '</span></button>';
}
function itemTile(i){
  const g = k => ui.screen === "wardrobe" && ui.tiers.indexOf(k) > -1;
  const cap = [];
  if (!g("colour")) cap.push(i.colour || "—");
  if (!g("brand") && i.brand) cap.push(i.brand);
  const sub = [];
  if (i.fabric || i.ffam) sub.push(fabricLabel(i, g("fabric")));
  if (!g("size") && i.size) sub.push("Size " + i.size);
  if (!g("cohort")) sub.push(cohort(i.acquired));
  if (!cap.length) cap.push(sub.shift() || "Shirt");
  const on = inkOn(i.colour);
  const face = '<button class="tile' + (i.retired ? " retired" : "") + '" data-id="' + i.id + '">' +
    '<span class="face">' + swatchHTML(i.colour, i.neck === "Vee", "fill") + '</span>' +
    '<span class="cap">' + esc(cap.join(" · ")) +
    (sub.length ? '<span>' + esc(sub.join(" · ")) + '</span>' : '') + '</span></button>';
  if (i.qty <= 0)                              // an entry you own none of, still editable
    return face.replace('class="face', 'class="face zeroed')
               .replace('</span><span class="cap"', '<span class="q" style="color:' + on + '">0</span></span><span class="cap"');
  return face.repeat(i.qty);                   // one tile per shirt
}
function itemsBlock(list, depth){
  const sorted = list.slice().sort((a,b) =>
    colourRank(a.colour) - colourRank(b.colour) ||
    a.neck.localeCompare(b.neck) ||
    (b.acquired || "0000-00").localeCompare(a.acquired || "0000-00") ||
    a.brand.localeCompare(b.brand));
  if (ui.screen === "stocktake")
    return '<div' + (depth ? ' class="d' + (depth+1) + '"' : '') + '>' + sorted.map(auditRow).join("") + '</div>';
  if (ui.view === "tiles") return '<div class="tiles' + (depth ? " d" + (depth+1) : "") + '">' + sorted.map(itemTile).join("") + '</div>';
  return '<div' + (depth ? ' class="d' + (depth+1) + '"' : '') + '>' + sorted.map(itemRow).join("") + '</div>';
}

function renderGroups(list, tiers, depth){
  if (!tiers.length) return itemsBlock(list, depth);
  const dk = tiers[0], d = DIMS[dk];
  let h = "";
  groupOrder(list, dk).forEach(k => {
    const g = list.filter(i => d.key(i) === k);
    const lvl = depth + 1;
    const tag = lvl === 1 ? "h2" : lvl === 2 ? "h3" : "h4";
    const label = k + ((d.suffix && d.suffix[k]) || "");
    let extra = "";
    if (d.mix){
      const fabs = uniq(g, i => i.fabric).map(f => f + " " + sum(g.filter(i => i.fabric === f)));
      if (fabs.length) extra = '<span class="gmix">' + esc(fabs.join(" · ")) + '</span>';
    }
    const sw = d.swatch ? '<i class="sw" style="' + swatchStyle((g[0] || {}).colour) + '"></i>' : "";
    let allhere = "";
    if (ui.screen === "stocktake" && lvl <= 2 && g.some(i => marks(i).indexOf("u") > -1)){
      groupBuckets.push(g);
      allhere = '<button class="allhere" data-gall="' + (groupBuckets.length - 1) + '">All here</button>';
    }
    h += '<div class="g' + lvl + ' ghead' + (lvl > 1 ? " d" + lvl : "") + '">' + sw +
         '<' + tag + '>' + esc(label) + '</' + tag + '>' + extra + allhere +
         '<span class="n">' + sum(g) + '</span></div>';
    h += renderGroups(g, tiers.slice(1), lvl);
  });
  return h;
}

/* ============================== stock-take ============================== */
const ST = { u:"Unknown", w:"Wardrobe", l:"Laundry" };
function fmtDate(iso){
  const d = new Date(iso);
  return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}
function auditScope(){
  return items.filter(i => !i.retired && i.qty > 0 &&
    (i.cat === "Everyday" || (ui.auditPyjamas && i.cat === "Pyjamas")));
}
function marks(i){                                  // one letter per physical shirt
  const raw = (audit && audit.marks[i.id]) || [];
  const out = [];
  for (let n = 0; n < i.qty; n++) out.push(raw[n] === "w" || raw[n] === "l" ? raw[n] : "u");
  return out;
}
function tally(list){
  const t = {w:0, l:0, u:0, total:0};
  (list || auditScope()).forEach(i => { marks(i).forEach(m => t[m]++); t.total += i.qty; });
  return t;
}
function setMark(id, n, val){
  if (!audit) return;
  const it = items.find(i => i.id === id); if (!it) return;
  const m = marks(it); m[n] = val;
  audit.marks[id] = m;
  audit.updated = new Date().toISOString();
  persist(); render();
}
function bulk(list, val){
  list.forEach(i => { audit.marks[i.id] = marks(i).map(m => (val === "rest" ? (m === "u" ? "l" : m) : val)); });
  audit.updated = new Date().toISOString();
  persist(); render();
}
const NEXT = { u:"w", w:"l", l:"u" };
let groupBuckets = [];

function auditRow(i){
  const lm = leadAndMeta(i), m = marks(i);
  let pips = "";
  if (i.qty <= 12){
    m.forEach((st,n) => {
      pips += '<button class="pip s-' + st + '" data-aid="' + i.id + '" data-n="' + n +
              '" aria-label="Shirt ' + (n+1) + ': ' + ST[st] + '"></button>';
    });
  } else {
    const c = m.filter(x => x === "w").length;
    pips = '<button class="pip wide" data-aid="' + i.id + '" data-n="-1">' + c + " / " + i.qty + '</button>';
  }
  const bits = [lm.meta];
  const carried = audit && audit.carry && audit.carry[i.id];
  if (carried) bits.push("Missing since " + fmtDate(audit.carryDate));
  else if (m.indexOf("u") > -1 && i.lastSeen) bits.push("Last seen " + fmtDate(i.lastSeen));
  return '<div class="arow' + (m.indexOf("u") < 0 ? " done" : "") + (carried ? " carried" : "") + '">' +
    swatchHTML(i.colour, i.neck === "Vee", "sw-lg") +
    '<span class="body"><span class="l1">' + esc(lm.lead) + '</span>' +
    '<span class="l2">' + esc(bits.filter(Boolean).join(" · ")) + '</span></span>' +
    '<span class="pips">' + pips + '</span></div>';
}
function screenStocktake(){
  let h = "";

    h += '<div class="empty" style="padding:34px 0 10px"><b>No stock-take running</b>' +
         'Work through a drawer at a time. Anything you cannot place stays unknown.</div>';

         '<div class="figs"><span><b>' + t.w + '</b> in the drawer</span>' +

         '<span class="tapnote">Tap to cycle</span></div></div>';

           '<span class="r">' + a.w + ' drawer · ' + a.l + ' wash' + (a.u ? ' · ' + a.u + ' unknown' : '') + '</span></button>';

function histSheet(n){
  const a = history[n];
  let h = '<div class="sheethead"><h3>' + fmtDate(a.finished) + '</h3><button class="done" id="sCancel">Close</button></div>';
  h += '<p class="note">' + a.w + ' in the drawer, ' + a.l + ' in the wash, ' + a.u + ' unknown, out of ' + a.total + '.</p>';
  if (a.missing.length){
    h += '<div class="g1"><h2>Unknown</h2><span class="n">' + a.u + '</span></div>';
    a.missing.forEach(m => {
      h += '<div class="arow">' + swatchHTML(m.colour, m.vee, "sw-lg") +
           '<span class="body"><span class="l1">' + esc(m.lead) + '</span><span class="l2">' + esc(m.meta) + '</span></span>' +

    });
  }
  h += '<div style="height:24px"></div>';
  openSheet(h);
  el("sCancel").onclick = closeSheet;
}
function finishAudit(){
  const scope = auditScope(), t = tally(scope);
  if (t.u && !confirm(t.u + " shirt" + (t.u === 1 ? " is" : "s are") + " still unknown. Save the stock-take anyway?")) return;
  const when = new Date().toISOString();
  const carry = {};
  const missing = scope.filter(i => marks(i).indexOf("u") > -1).map(i => {
    const lm = leadAndMeta(i), n = marks(i).filter(m => m === "u").length;
    carry[i.id] = n;
    return { id:i.id, colour:i.colour, vee:i.neck === "Vee", lead:lm.lead, meta:lm.meta, n:n };
  });
  history.unshift({ finished:when, started:audit.started, total:t.total, w:t.w, l:t.l, u:t.u,
                    missing:missing, carry:carry });
  history = history.slice(0,12);
  items = items.map(i => marks(i).some(m => m !== "u") ? Object.assign({}, i, {lastSeen:when}) : i);
  audit = null; ui.auditOutstanding = false;
  persist(); render();
  toast(t.u ? t.u + " still unknown" : "All " + t.total + " placed");
}

function padBlock(){

  DIM_KEYS.forEach(k => {
    const t = ui.tiers.indexOf(k);
    h += '<button class="pk" data-dim="' + k + '" aria-pressed="' + (t > -1) + '">' +
      (t > -1 ? '<span class="t">' + (t+1) + '</span>' : '') + esc(DIMS[k].label) + '</button>';
  });
  h += '</div>';
  h += '<p class="padhint">' + (ui.tiers.length
    ? "Grouped by <b>" + ui.tiers.map(k => DIMS[k].label.toLowerCase()).join("</b>, then <b>") + "</b>."
    : "Ungrouped — tap up to three, in the order you want them nested.") + '</p>';
  h += '</section>';
  return h;
}
function toolbar(){
  const fc = filterCount();
  return '<div class="toolbar">' +
    '<div class="seg"><button data-view="list" aria-pressed="' + (ui.view === "list") + '">List</button>' +
    '<button data-view="tiles" aria-pressed="' + (ui.view === "tiles") + '">Tiles</button></div>' +
    '<div class="right"><button class="chip" aria-pressed="' + ui.showFilters + '" id="btnFilters">Filter' +
    (fc ? ' <span class="n">' + fc + '</span>' : '') + '</button></div></div>';
}
function filterPanel(){
  const pool = wardrobe();
  let h = '<div class="filterpanel"><input id="q" type="search" placeholder="Search brand, fabric, colour…" value="' + esc(ui.q) + '">';
  DIM_KEYS.forEach(dk => {
    const d = DIMS[dk];
    const keys = groupOrder(pool, dk);
    if (keys.length < 2) return;
    h += '<div class="chipgroup"><p class="eyebrow" style="margin-bottom:7px">' + d.label + '</p><div class="chiprow">';
    keys.forEach(k => {
      const on = ui.filters[dk].indexOf(k) > -1;
      const ex = d.swatch ? pool.find(i => d.key(i) === k) : null;
      h += '<button class="chip" aria-pressed="' + on + '" data-f="' + dk + '" data-v="' + esc(k) + '">' +
        (ex ? '<i class="sw" style="' + swatchStyle(ex.colour) + '"></i>' : '') + esc(k) +
        ' <span class="n">' + sum(pool.filter(i => d.key(i) === k)) + '</span></button>';
    });
    h += '</div></div>';
  });
  h += '<div class="filtertoggle"><button class="chip" aria-pressed="' + ui.showRetired + '" id="btnRetired">Show retired</button>' +
       (filterCount() ? '<button class="clear" id="btnClear">Clear</button>' : '') + '</div></div>';
  return h;
}
function screenWardrobe(){
  const list = filtered();
  let h = padBlock() + toolbar();
  if (ui.showFilters) h += filterPanel();
  if (!list.length){
    h += '<div class="empty"><b>Nothing matches</b>Loosen a filter, or add the shirt you were looking for.</div>';
  } else {
    h += renderGroups(list, ui.tiers, 0);
    h += '<p class="note">' + sum(list) + ' shirts across ' + list.length + ' entries. Tap any shirt to edit it.</p>';
  }
  return h;
}
function screenPyjamas(){
  const list = pyjamas();
  if (!list.length) return '<div class="empty"><b>No pyjama shirts</b>Retire a shirt here when it is past wearing out of the house.</div>';
  let h = '<p class="note" style="margin-top:16px">Demoted from the wardrobe and kept out of every count on the other screens.</p>';
  const necks = ["Crew","Vee","Other"].filter(n => list.some(i => i.neck === n));
  necks.forEach(n => {
    const g = list.filter(i => i.neck === n);
    h += '<div class="g1"><h2>' + esc(n + (n === "Other" ? "" : " neck")) + '</h2><span class="n">' + sum(g) + '</span></div>';
    h += g.map(itemRow).join("");
  });
  h += '<p class="note">' + sum(list) + ' shirts.</p>';
  return h;
}
function screenSummary(){
  const list = wardrobe();
  const necks = ["Crew","Vee","Other"].filter(n => list.some(i => i.neck === n));
  const fams = groupOrder(list, "colour");
  let h = "";

  h += '<section><p class="eyebrow">Every shirt, one square</p>';
  fams.forEach(f => {
    const g = list.filter(i => family(i.colour) === f);
    h += '<div class="wrow"><div class="cap"><span>' + esc(f) + '</span><span class="n">' + sum(g) + '</span></div><div class="wgrid">';
    g.slice().sort((a,b) => a.neck.localeCompare(b.neck)).forEach(i => {
      for (let n = 0; n < i.qty; n++) h += swatchHTML(i.colour, i.neck === "Vee", "u");
    });
    h += '</div></div>';
  });
  h += '<div class="legend"><span><i></i>Crew</span><span>' +
    '<svg class="v" viewBox="0 0 40 40" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="M1.2 1.2 H12.5 L20 16 L27.5 1.2 H38.8 V38.8 H1.2 Z" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
    '</svg>Vee</span></div></section>';

  h += '<section><p class="eyebrow">Colour against cut</p><table><thead><tr><th class="k">Colour</th>';
  necks.forEach(n => h += '<th>' + esc(n) + '</th>');
  h += '<th>All</th></tr></thead><tbody>';
  fams.forEach(f => {
    const g = list.filter(i => family(i.colour) === f);
    h += '<tr><td class="k"><span class="kcell"><i class="sw" style="' + swatchStyle(g[0].colour) + '"></i>' + esc(f) + '</span></td>';
    necks.forEach(n => { const v = sum(g.filter(i => i.neck === n)); h += '<td class="n' + (v ? "" : " zero") + '"><span>' + v + '</span></td>'; });
    h += '<td class="n">' + sum(g) + '</td></tr>';
  });
  h += '<tr class="tot"><td class="k">Total</td>';
  necks.forEach(n => h += '<td class="n">' + sum(list.filter(i => i.neck === n)) + '</td>');
  h += '<td class="n">' + sum(list) + '</td></tr></tbody></table>';
  h += '<p class="note">A dot marks a combination you own none of.</p></section>';

  const total = sum(list) || 1;
  const pct = v => Math.round(v / total * 100) + "%";

  h += '<section><p class="eyebrow">Fabric</p><table><tbody>';
  FABRIC_FAMILIES.forEach(ff => {
    const g = list.filter(i => i.ffam === ff);
    if (!g.length) return;
    h += '<tr><td class="k">' + esc(ff) + '</td><td class="n">' + sum(g) + '</td><td class="n" style="width:52px;color:var(--mute)">' + pct(sum(g)) + '</td></tr>';
    uniq(g, i => i.fabric || "Unrecorded").forEach(f => {
      const v = sum(g.filter(i => (i.fabric || "Unrecorded") === f));
      h += '<tr><td class="k sub">' + esc(f) + '</td><td class="n" style="color:var(--mute)">' + v + '</td><td></td></tr>';
    });
  });
  h += '</tbody></table></section>';

  const LEG = "\u0000";
  h += '<section><p class="eyebrow">Cohort</p><table><tbody>';
  uniq(list, i => i.acquired || LEG).sort((a,b) => (b === LEG ? "0" : b).localeCompare(a === LEG ? "0" : a)).forEach(k => {
    const v = sum(list.filter(i => (i.acquired || LEG) === k));
    h += '<tr><td class="k">' + esc(k === LEG ? "Legacy" : cohort(k)) + '</td><td class="n">' + v + '</td><td class="n" style="width:52px;color:var(--mute)">' + pct(v) + '</td></tr>';
  });
  h += '</tbody></table></section>';

  [["Brand", i => i.brand || "—"], ["Size", i => i.size || "—"]].forEach(pair => {
    const keys = uniq(list, pair[1]).sort((a,b) => sum(list.filter(i => pair[1](i) === b)) - sum(list.filter(i => pair[1](i) === a)));
    h += '<section><p class="eyebrow">' + pair[0] + '</p><table><tbody>';
    keys.forEach(k => {
      const v = sum(list.filter(i => pair[1](i) === k));
      h += '<tr><td class="k">' + esc(k) + '</td><td class="n">' + v + '</td><td class="n" style="width:52px;color:var(--mute)">' + pct(v) + '</td></tr>';
    });
    h += '</tbody></table></section>';
  });

  const py = sum(pyjamas());
  h += '<p class="note">Counts cover the ' + sum(list) + ' shirts in the wardrobe.' +
       (py ? ' The ' + py + ' pyjama shirts sit outside these figures.' : '') + '</p>';
  return h;
}

/* ============================== render ============================== */
function render(){
  const s = ui.screen;
  el("hdrTitle").textContent = s === "summary" ? "Summary" : s === "pyjamas" ? "Pyjamas" :
    s === "stocktake" ? "Stock-take" : "T-Shirt Wardrobe";
  el("hdrCount").textContent = s === "pyjamas" ? sum(pyjamas()) + " shirts"
    : s === "summary" ? sum(wardrobe()) + " shirts"
    : s === "stocktake" ? (audit ? (tally().total - tally().u) + " of " + tally().total + " placed" : "not started")
    : sum(filtered()) + " shirts";

  el("navrow").innerHTML = s === "wardrobe"
    ? '<button class="nav" data-go="summary">Summary</button>' +
      '<button class="nav" data-go="stocktake">Stock-take' +
      (audit && tally().u ? ' <span class="num">' + tally().u + '</span>' : '') + '</button>' +
      '<button class="nav" data-go="pyjamas">Pyjamas</button>' +
      '<span class="sp"><button class="add" id="btnAdd">+ Add</button><button id="btnMenu">•••</button></span>'
    : '<button class="back" data-go="wardrobe">‹ Wardrobe</button>' +
      '<span class="sp">' + (s === "pyjamas" ? '<button class="add" id="btnAdd">+ Add</button>' : '') +
      '<button id="btnMenu">•••</button></span>';

  el("view").innerHTML = s === "summary" ? screenSummary() : s === "pyjamas" ? screenPyjamas() :
    s === "stocktake" ? screenStocktake() : screenWardrobe();
}

/* ============================== sheet ============================== */
function openSheet(html){ el("sheet").innerHTML = html; el("sheet").classList.add("on"); el("scrim").classList.add("on"); }
function closeSheet(){ el("sheet").classList.remove("on"); el("scrim").classList.remove("on"); }
function toast(m){ const t = el("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1900); }

function field(label, id, value, type, ph, list){
  return '<div class="f"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type||"text") +
    '" value="' + esc(value) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') +
    (list ? ' list="' + list + '" autocapitalize="words"' : '') + '></div>';
}
function selectF(label, id, values, cur){
  return '<div class="f"><label for="' + id + '">' + label + '</label><select id="' + id + '">' +
    values.map(v => '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + '>' + esc(v) + '</option>').join("") +
    '</select></div>';
}
function datalist(id, values){ return '<datalist id="' + id + '">' + values.map(v => '<option value="' + esc(v) + '">').join("") + '</datalist>'; }

function editItem(id){
  const isNew = !id;
  const it = isNew
    ? normalise({ cat: ui.screen === "pyjamas" ? "Pyjamas" : "Everyday", neck: ui.filters.cut[0] || "Crew",
                  qty:1, acquired: thisMonth() })
    : Object.assign({}, items.find(i => i.id === id));

  let h = '<div class="sheethead"><button class="cancel" id="sCancel">Cancel</button><h3>' +
          (isNew ? "Add shirts" : "Edit shirt") + '</h3><button class="done" id="sSave">Save</button></div>';
  h += datalist("dlBrand", uniq(items, i => i.brand));
  h += datalist("dlFabric", uniq(items, i => i.fabric).concat(Object.keys(FABRIC_MAP).map(k => k.replace(/\b\w/g, c => c.toUpperCase()))));
  h += datalist("dlColour", uniq(items, i => i.colour).concat(Object.keys(SWATCH).map(k => k.replace(/\b\w/g, c => c.toUpperCase()))));

  h += '<div class="f"><label>How many</label><div class="stepper"><button id="qMinus" aria-label="One fewer">−</button>' +
       '<span class="v" id="qVal">' + it.qty + '</span><button id="qPlus" aria-label="One more">+</button></div></div>';
  h += '<div class="f2">' + selectF("Cut", "f_neck", ["Crew","Vee","Other"], it.neck) +
       field("Colour", "f_colour", it.colour, "text", "Navy", "dlColour") + '</div>';
  h += '<div class="f2">' + field("Brand", "f_brand", it.brand, "text", "Uniqlo", "dlBrand") +
       field("Size", "f_size", it.size, "text", "S") + '</div>';
  h += '<div class="f2">' + field("Fabric", "f_fabric", it.fabric, "text", "66/34", "dlFabric") +
       selectF("Fabric family", "f_ffam", FABRIC_FAMILIES, it.ffam) + '</div>';
  h += '<p class="hint">The family is set from the fabric name where it is recognised — override it here for anything new.</p>';
  h += '<div class="f2">' + field("Fit", "f_fit", it.fit, "text", "Slim") +
       field("Cohort", "f_acq", it.acquired, "month", "2026-07") + '</div>';
  h += '<p class="hint">' + (it.acquired || !isNew
    ? "Legacy shirts keep their blank date; anything dated stays dated."
    : "New shirts need a cohort — the month you bought them.") + '</p>';
  h += field("Notes", "f_notes", it.notes, "text", "3 marked");

  if (!isNew){
    h += '<div class="rowbtns">' +
      '<button id="bCat">' + (it.cat === "Pyjamas" ? "Back to the wardrobe" : "Demote to pyjamas") + '</button>' +
      (it.cat === "Everyday" ? '<button id="bRetire">' + (it.retired ? "Un-retire" : "Retire") + '</button>' : '') +
      '</div><div class="rowbtns"><button class="danger" id="bDel">Delete</button></div>';
  }
  h += '<div style="height:20px"></div>';
  openSheet(h);

  let qty = it.qty, autoFam = true;
  const setQ = v => { qty = Math.max(0, v); el("qVal").textContent = qty; };
  el("qMinus").onclick = () => setQ(qty - 1);
  el("qPlus").onclick  = () => setQ(qty + 1);
  el("f_fabric").addEventListener("input", e => { if (autoFam) el("f_ffam").value = fabricFamily(e.target.value); });
  el("f_ffam").addEventListener("change", () => { autoFam = false; });
  el("sCancel").onclick = closeSheet;
  el("sSave").onclick = async () => {
    if (!el("f_acq").value && (isNew || it.acquired)){
      toast(isNew ? "Give it a cohort — the month you bought it" : "Only the original legacy shirts can have no cohort");
      el("f_acq").focus(); return;
    }
    const next = normalise({ id:it.id, cat:it.cat, retired:it.retired, qty:qty,
      neck:el("f_neck").value, colour:el("f_colour").value.trim(), brand:el("f_brand").value.trim(),
      fabric:el("f_fabric").value.trim(), ffam:el("f_ffam").value, size:el("f_size").value.trim().toUpperCase(),
      fit:el("f_fit").value.trim(), acquired:el("f_acq").value, notes:el("f_notes").value.trim() });
    if (isNew) items.push(next); else items = items.map(i => i.id === it.id ? next : i);
    await persist(); closeSheet(); render(); toast(isNew ? "Added" : "Saved");
  };
  if (!isNew){
    el("bCat").onclick = async () => {
      const to = it.cat === "Pyjamas" ? "Everyday" : "Pyjamas";
      items = items.map(i => i.id === it.id ? Object.assign({}, i, {cat:to, retired:false}) : i);
      await persist(); closeSheet(); render(); toast(to === "Pyjamas" ? "Moved to pyjamas" : "Back in the wardrobe");
    };
    if (el("bRetire")) el("bRetire").onclick = async () => {
      items = items.map(i => i.id === it.id ? Object.assign({}, i, {retired:!i.retired}) : i);
      await persist(); closeSheet(); render(); toast(it.retired ? "Un-retired" : "Retired");
    };
    el("bDel").onclick = async () => {
      if (!confirm("Delete this entry for good?")) return;
      items = items.filter(i => i.id !== it.id);
      await persist(); closeSheet(); render(); toast("Deleted");
    };
  }
}

/* ============================== export ============================== */
function toMarkdown(){
  const lines = ["# T-Shirts", ""];
  const LEG = "Legacy";
  ["Crew","Vee","Other"].forEach(n => {
    const g = items.filter(i => i.cat === "Everyday" && i.neck === n);
    if (!g.length) return;
    lines.push("### " + n + (n === "Other" ? "" : " Neck"));
    uniq(g, i => i.acquired || LEG).sort((a,b) => (b === LEG ? "0000-00" : b).localeCompare(a === LEG ? "0000-00" : a))
      .forEach(k => {
        lines.push("***" + (k === LEG ? LEG : cohort(k).replace(" ","-")) + "***");
        g.filter(i => (i.acquired || LEG) === k).forEach(i => {
          lines.push(i.qty + "x " +
            [i.brand,i.fabric,i.fit,i.colour,i.size].filter(Boolean).join(" - ") +
            (i.notes ? " (" + i.notes + ")" : "") + (i.retired ? " [retired]" : ""));
        });
      });
    lines.push("");
  });
  const py = pyjamas();
  if (py.length){
    lines.push("### Pyjamas");
    py.forEach(i => lines.push(i.qty + "x " +
      [i.brand,i.fabric,i.colour,i.neck === "Other" ? "" : i.neck].filter(Boolean).join(" - ") +
      (i.notes ? " (" + i.notes + ")" : "")));
  }
  return lines.join("\n");
}
function menu(){
  let h = '<div class="sheethead"><h3>Wardrobe data</h3><button class="done" id="sCancel">Close</button></div><div class="menu">' +
    '<button id="mBackup">Copy a backup<small>The full JSON, for pasting somewhere safe.</small></button>' +
    '<button id="mMd">Copy as Markdown<small>Rebuilds your original note format.</small></button>' +
    '<button id="mRestore">Restore from a backup<small>Paste JSON to replace everything stored.</small></button>' +
    '<button id="mReset">Start again from the note<small>Reloads the shirts from your original list.</small></button></div>';
  h += '<p class="note">Storage in use: ' + (Store.mode === "local" ? "this browser, on this device" :
       Store.mode === "host" ? "app storage" : "memory only — nothing will be kept, so copy a backup") + '.</p><div style="height:20px"></div>';
  openSheet(h);
  el("sCancel").onclick = closeSheet;
  const out = (text, label) => {
    openSheet('<div class="sheethead"><button class="cancel" id="sBack">Back</button><h3>' + label +
      '</h3><button class="done" id="sCopy">Copy</button></div><div class="f"><textarea class="io" id="ioBox" readonly>' +
      esc(text) + '</textarea></div><p class="note">If Copy does nothing, tap inside, select all, and copy by hand.</p><div style="height:20px"></div>');
    el("sBack").onclick = menu;
    el("sCopy").onclick = async () => {
      try{ await navigator.clipboard.writeText(text); toast("Copied"); }
      catch(e){ el("ioBox").focus(); el("ioBox").select(); toast("Select and copy"); }
    };
  };
  el("mBackup").onclick = () => out(JSON.stringify({v:3, items:items, ui:{tiers:ui.tiers, view:ui.view},
    audit:audit, history:history}, null, 1), "Backup");
  el("mMd").onclick = () => out(toMarkdown(), "Markdown");
  el("mRestore").onclick = () => {
    openSheet('<div class="sheethead"><button class="cancel" id="sBack">Back</button><h3>Restore</h3>' +
      '<button class="done" id="sGo">Replace</button></div><div class="f"><label for="ioBox">Paste a backup</label>' +
      '<textarea class="io" id="ioBox" placeholder="{ … }"></textarea></div>' +
      '<p class="note">This replaces everything currently in the app.</p><div style="height:20px"></div>');
    el("sBack").onclick = menu;
    el("sGo").onclick = async () => {
      try{
        const p = JSON.parse(el("ioBox").value);
        const arr = Array.isArray(p) ? p : p.items;
        if (!Array.isArray(arr)) throw new Error("bad");
        items = arr.map(normalise);
        audit = p.audit || null; history = Array.isArray(p.history) ? p.history : [];
        await persist(); closeSheet(); render(); toast("Restored");
      }catch(e){ toast("That is not a valid backup"); }
    };
  };
  el("mReset").onclick = async () => {
    if (!confirm("Replace everything with the original note?")) return;
    items = SEED.map(normalise); audit = null; history = [];
    await persist(); closeSheet(); render(); toast("Reset");
  };
}

/* ============================== wiring ============================== */
async function persist(){
  const ok = await Store.save({v:3, items:items, ui:{tiers:ui.tiers, view:ui.view},
    audit:audit, history:history});
  if (!ok) toast("Not saved — copy a backup");
}
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go){ ui.screen = go.dataset.go; render(); window.scrollTo(0,0); return; }
  const pk = e.target.closest(".pk[data-dim]");
  if (pk){
    const k = pk.dataset.dim, at = ui.tiers.indexOf(k);
    if (at > -1) ui.tiers.splice(at,1);
    else if (ui.tiers.length >= 3){ toast("Three tiers is the limit — tap one off first"); return; }
    else ui.tiers.push(k);
    persist(); render(); return;
  }
  const v = e.target.closest("[data-view]");
  if (v){ ui.view = v.dataset.view; persist(); render(); return; }
  const fc = e.target.closest(".chip[data-f]");
  if (fc){
    const arr = ui.filters[fc.dataset.f], at = arr.indexOf(fc.dataset.v);
    if (at > -1) arr.splice(at,1); else arr.push(fc.dataset.v);
    render(); return;
  }
  const pip = e.target.closest(".pip[data-aid]");
  if (pip){
    const id = pip.dataset.aid, n = +pip.dataset.n, item = items.find(i => i.id === id);
    const m = marks(item);
    if (n < 0) bulk([item], NEXT[m[0]]);            // wide control cycles the whole entry
    else setMark(id, n, NEXT[m[n]]);
    return;
  }
  const hb = e.target.closest("[data-hist]");
  if (hb){ histSheet(+hb.dataset.hist); return; }
  if (e.target.closest("#stStart")){
    const last = history[0];
    audit = { started:new Date().toISOString(), updated:"", marks:{},
              carry:(last && last.u ? last.carry : null), carryDate:(last ? last.finished : "") };
    ui.auditOutstanding = false; persist(); render();
    if (audit.carry) toast(last.u + " carried over from last time");
    return;
  }
  if (e.target.closest("#stOut")){ ui.auditOutstanding = !ui.auditOutstanding; render(); return; }
  if (e.target.closest("#stPy")){ ui.auditPyjamas = !ui.auditPyjamas; render(); return; }
  if (e.target.closest("#stRest")){
    bulk(auditScope(), "rest"); toast("Everything unknown sent to the wash"); return;
  }
  if (e.target.closest("#stNone")){ bulk(auditScope(), "u"); toast("Cleared"); return; }
  const gall = e.target.closest("[data-gall]");
  if (gall){
    const b = groupBuckets[+gall.dataset.gall] || [];
    bulk(b, "w"); toast(sum(b) + " marked as here"); return;
  }
  if (e.target.closest("#stAbandon")){
    if (!confirm("Throw this stock-take away?")) return;
    audit = null; persist(); render(); toast("Abandoned"); return;
  }
  if (e.target.closest("#stFinish")){ finishAudit(); return; }
  const it = e.target.closest("[data-id]");
  if (it){ editItem(it.dataset.id); return; }
  if (e.target.closest("#btnFilters")){ ui.showFilters = !ui.showFilters; render(); return; }
  if (e.target.closest("#btnRetired")){ ui.showRetired = !ui.showRetired; render(); return; }
  if (e.target.closest("#btnClear")){
    DIM_KEYS.forEach(k => ui.filters[k] = []); ui.q = ""; render(); return;
  }
  if (e.target.closest("#btnAdd")){ editItem(null); return; }
  if (e.target.closest("#btnMenu")){ menu(); return; }
});
document.addEventListener("input", e => {
  if (e.target.id === "q"){
    ui.q = e.target.value; render();
    const q = el("q"); if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
});
el("scrim").onclick = closeSheet;

(async function start(){
  await Store.init();
  const saved = await Store.load();
  const arr = Array.isArray(saved) ? saved : (saved && saved.items);
  items = (arr && arr.length ? arr : SEED).map(normalise);
  if (saved && saved.audit) audit = saved.audit;
  if (saved && Array.isArray(saved.history)) history = saved.history;
  if (saved && saved.ui){
    if (Array.isArray(saved.ui.tiers)) ui.tiers = saved.ui.tiers.filter(k => DIM_KEYS.indexOf(k) > -1).slice(0,3);
    if (saved.ui.view) ui.view = saved.ui.view;
  }
  render();
})();
</script>
</body>
